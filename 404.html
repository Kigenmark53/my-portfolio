<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page not found — Mark Kigen</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <style>
    :root {
      --ink: #f4f4f8;
      --ink-2: #b9b9c9;
      --violet: #7c5cff;
      --cyan: #22d3ee;
      --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 28px;
      background:
        radial-gradient(70vw 60vh at 10% 0%, rgba(124, 92, 255, 0.30), transparent 62%),
        radial-gradient(60vw 55vh at 92% 18%, rgba(34, 211, 238, 0.20), transparent 62%),
        radial-gradient(60vw 60vh at 60% 110%, rgba(251, 113, 133, 0.18), transparent 64%),
        #06060b;
      color: var(--ink);
      font-family: "Inter Tight", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .box {
      max-width: 560px;
      text-align: center;
      padding: clamp(28px, 5vw, 48px);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 26px;
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(18px) saturate(130%);
      -webkit-backdrop-filter: blur(18px) saturate(130%);
      box-shadow: 0 40px 90px -40px rgba(0, 0, 0, 0.9);
    }
    .code {
      font-family: var(--mono);
      font-size: 0.7rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--ink-2);
    }
    h1 {
      margin: 14px 0 12px;
      font-size: clamp(2.4rem, 9vw, 3.6rem);
      font-weight: 600;
      letter-spacing: -0.045em;
      line-height: 1;
      background: linear-gradient(100deg, #c4b5fd, var(--cyan));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    p { margin: 0 0 26px; color: var(--ink-2); line-height: 1.65; font-size: 0.98rem; }
    a {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 22px;
      border-radius: 999px;
      background: linear-gradient(135deg, #f6f5ff, #ded9ff);
      color: #120b2e;
      font-size: 0.92rem;
      font-weight: 500;
      text-decoration: none;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
      box-shadow: 0 14px 40px -18px rgba(196, 181, 253, 0.75);
    }
    a:hover { transform: translateY(-2px); box-shadow: 0 20px 50px -18px rgba(196, 181, 253, 0.95); }
  </style>
</head>
<body>
  <main class="box">
    <p class="code">404 · not found</p>
    <h1>This page took a wrong turn.</h1>
    <p>The link you followed doesn&rsquo;t exist here. The good stuff is one click away.</p>
    <a href="./">Back to the portfolio <span aria-hidden="true">→</span></a>
  </main>
</body>
</html>
